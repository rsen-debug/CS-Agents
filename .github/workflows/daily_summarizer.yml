name: Daily Ticket Summarizer

on:
  schedule:
    - cron: '50 8 * * *'   # Every day at 8:00 AM UTC — adjust to your timezone
  workflow_dispatch:        # Allows manual runs from the GitHub Actions UI

jobs:
  run-summarizer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run summarizer
        env:
          DO_INFERENCE_TOKEN: ${{ secrets.DO_INFERENCE_TOKEN }}
          CZ_AUTH_TOKEN: ${{ secrets.CZ_AUTH_TOKEN }}
          CZ_APP_KEY: ${{ secrets.CZ_APP_KEY }}
        run: python summarize_tickets.py
